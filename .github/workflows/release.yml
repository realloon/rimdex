name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            asset_name: rimdex-osx-arm64.zip
            binary_name: rimdex
          - os: ubuntu-latest
            rid: linux-x64
            asset_name: rimdex-linux-x64.zip
            binary_name: rimdex
          - os: windows-latest
            rid: win-x64
            asset_name: rimdex-win-x64.zip
            binary_name: rimdex.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev zip

      - name: Setup Windows MSVC build tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Publish Native AOT binary
        run: dotnet publish rimdex.csproj -c Release -r ${{ matrix.rid }} -o ./publish

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd publish
          zip -9 -r "$GITHUB_WORKSPACE/${{ matrix.asset_name }}" ${{ matrix.binary_name }}

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "publish\${{ matrix.binary_name }}" -DestinationPath "${{ matrix.asset_name }}" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
